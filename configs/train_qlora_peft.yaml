# Same as train_qlora.yaml — explicit PEFT backend name for README clarity
experiment_name: qlora_1.7b_peft
model_name: Qwen/Qwen3-1.7B
backend: peft

load_in_4bit: true
max_seq_length: 768
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

learning_rate: 0.0002
num_train_epochs: 2
warmup_ratio: 0.05
weight_decay: 0.01
optim: paged_adamw_8bit
fp16: false
bf16: true
auto_precision: true
logging_steps: 20
save_steps: 200
eval_steps: 100
max_train_examples: null

train_path: data/processed/arena_train.jsonl
val_path: data/processed/arena_val.jsonl
output_dir: outputs/qlora_1.7b
seed: 42
report_to: none
